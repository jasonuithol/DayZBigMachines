// Skeletons and animations for the BigMachines models. Binarize bakes this into each
// .p3d whose file name matches a CfgModels class. Joint angles and cylinder swings come from
// the blender/build_*.py scripts, which print them.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	//! Every crawler: the four rollers
	class BM_Crawler_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"wheel_1_1", "",
			"wheel_1_2", "",
			"wheel_2_1", "",
			"wheel_2_2", ""
		};
	};
	//! crewDriver: the engine finds the driver's seat proxy through a bone of this name
	class BM_Bulldozer_Skeleton: BM_Crawler_Skeleton
	{
		skeletonInherit = "BM_Crawler_Skeleton";
		skeletonBones[] =
		{
			"blade", "",
			"blade_cyl", "",
			"blade_rod", "blade_cyl",
			"crewDriver", ""
		};
	};
	//! The house is the root; slewing turns the whole machine and the undercarriage (tracks,
	//! rollers) turns back the other way (BM_Excavator.c)
	class BM_Excavator_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"undercarriage", "",
			"wheel_1_1", "undercarriage",
			"wheel_1_2", "undercarriage",
			"wheel_2_1", "undercarriage",
			"wheel_2_2", "undercarriage",
			"crewDriver", "",
			"boom", "",
			"boom_cyl", "",
			"boom_rod", "boom_cyl",
			"stick", "boom",
			"stick_cyl", "boom",
			"stick_rod", "stick_cyl",
			"bucket", "stick",
			"bucket_cyl", "stick",
			"bucket_rod", "bucket_cyl"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class bm_dozer_roller: Default {};
	class bm_exc_roller: Default {};

	//! The wheel bones hold the wheel items' proxies (invisible: the game moves these bones
	//! with the suspension, see blender/crawler.py). Rotation, steering and suspension
	//! animations must exist (config.cpp animRotation / animTurn / animDamper).
	class BM_Crawler: Default
	{
		skeletonName = "BM_Crawler_Skeleton";
		class Animations
		{
			class wheelfrontleft
			{
				type = "rotationX";
				source = "wheelfrontleft";
				selection = "wheel_1_1";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -360";
			};
			class wheelfrontright: wheelfrontleft
			{
				source = "wheelfrontright";
				selection = "wheel_2_1";
				axis = "wheel_2_1_axis";
			};
			class wheelbackleft: wheelfrontleft
			{
				source = "wheelbackleft";
				selection = "wheel_1_2";
				axis = "wheel_1_2_axis";
			};
			class wheelbackright: wheelfrontleft
			{
				source = "wheelbackright";
				selection = "wheel_2_2";
				axis = "wheel_2_2_axis";
			};
			class turnfrontleft
			{
				type = "rotationY";
				source = "turnfrontleft";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = 0;
				angle1 = 0;
			};
			class turnfrontright: turnfrontleft
			{
				source = "turnfrontright";
				selection = "wheel_2_1";
			};
			class turnbackleft: turnfrontleft
			{
				source = "turnbackleft";
				selection = "wheel_1_2";
			};
			class turnbackright: turnfrontleft
			{
				source = "turnbackright";
				selection = "wheel_2_2";
			};
			class damper_1_1
			{
				type = "translationY";
				source = "damper_1_1";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0;
			};
			class damper_2_1: damper_1_1
			{
				source = "damper_2_1";
				selection = "wheel_2_1";
			};
			class damper_1_2: damper_1_1
			{
				source = "damper_1_2";
				selection = "wheel_1_2";
			};
			class damper_2_2: damper_1_1
			{
				source = "damper_2_2";
				selection = "wheel_2_2";
			};
		};
	};

	class bm_bulldozer: BM_Crawler
	{
		skeletonName = "BM_Bulldozer_Skeleton";
		class Animations: Animations
		{
			// Blade lift: phase 0 = down (cutting edge just above the ground), 1 = raised
			class BladeLift
			{
				type = "rotationX";
				source = "bladeLift";
				selection = "blade";
				axis = "blade_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -1.1";
				angle1 = "rad 15";
			};
			// Lift cylinder barrels follow the blade mount
			class BladeCylinders: BladeLift
			{
				source = "bladeCyl";	// never share a source between animations (BM_Machine.AddJoint)
				selection = "blade_cyl";
				axis = "blade_cyl_axis";
				angle0 = "rad -1.11";
				angle1 = "rad 20.42";
			};
			// Each cylinder's rod slides in its barrel (offsets: blender/build_bulldozer.py)
			class BladeRods
			{
				type = "translation";
				source = "bladeRod";
				selection = "blade_rod";
				axis = "blade_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0.037;
				offset1 = -0.49;
			};
		};
	};

	class bm_excavator: BM_Crawler
	{
		skeletonName = "BM_Excavator_Skeleton";
		class Animations: Animations
		{
			// Slewing: the machine turns by the slew angle and the tracks turn back by it.
			// Phase 0.5 = no slew; 0 / 1 = half a turn either way (the source wraps round).
			class Undercarriage
			{
				type = "rotationY";
				source = "slew";
				selection = "undercarriage";
				axis = "undercarriage_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -180";	// checked in game: the other way round doubles the turn
				angle1 = "rad 180";
			};
			// Each animation has a source of its own: two sharing one scramble the sources
			// after them (BM_Machine.AddJoint sets each cylinder's in step with its joint)
			class Boom
			{
				type = "rotationX";
				source = "boom";
				selection = "boom";
				axis = "boom_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -35";
				angle1 = "rad 30";
			};
			class BoomCylinders
			{
				type = "rotationX";
				source = "boomCyl";
				selection = "boom_cyl";
				axis = "boom_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -39.29";
				angle1 = "rad 28.39";
			};
			class Stick
			{
				type = "rotationX";
				source = "dipper";
				selection = "stick";
				axis = "stick_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -45";
				angle1 = "rad 40";
			};
			class StickCylinder
			{
				type = "rotationX";
				source = "dipperCyl";
				selection = "stick_cyl";
				axis = "stick_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -2.54";
				angle1 = "rad -9.13";
			};
			class Bucket
			{
				type = "rotationX";
				source = "bucket";
				selection = "bucket";
				axis = "bucket_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad 35";
				angle1 = "rad -95";	// 35 dumped, -95 curled in (the teeth face the machine)
			};
			class BucketCylinder
			{
				type = "rotationX";
				source = "bucketCyl";
				selection = "bucket_cyl";
				axis = "bucket_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -5.47";
				angle1 = "rad -6.96";
			};
			// Each cylinder's rod slides in its barrel (offsets: blender/build_excavator.py)
			class BoomRods
			{
				type = "translation";
				source = "boomRod";
				selection = "boom_rod";
				axis = "boom_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.317;
				offset1 = 0.289;
			};
			class StickRod
			{
				type = "translation";
				source = "dipperRod";
				selection = "stick_rod";
				axis = "stick_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0.714;
				offset1 = -0.531;
			};
			class BucketRod
			{
				type = "translation";
				source = "bucketRod";
				selection = "bucket_rod";
				axis = "bucket_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.212;
				offset1 = 0.621;
			};
		};
	};
};
