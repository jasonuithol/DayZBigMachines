// Skeletons and animations for the BigMachines models. Binarize bakes this into each
// .p3d whose file name matches a CfgModels class.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class BM_Bulldozer_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"wheel_1_1", "",
			"wheel_1_2", "",
			"wheel_2_1", "",
			"wheel_2_2", "",
			"blade", "",
			"blade_cyl", "",
			"crewDriver", ""	// the engine finds the seat proxy through a bone of this name
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class bm_dozer_roller: Default {};

	class bm_bulldozer: Default
	{
		skeletonName = "BM_Bulldozer_Skeleton";
		sections[] = {};
		class Animations
		{
			// Rollers (the physics wheels) spin with the wheels; names match the
			// animRotation entries in config.cpp's SimulationModule
			class wheelfrontleft
			{
				type = "rotationX";
				source = "wheelfrontleft";
				selection = "wheel_1_1";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -360";
			};
			class wheelfrontright: wheelfrontleft
			{
				source = "wheelfrontright";
				selection = "wheel_2_1";
				axis = "wheel_2_1_axis";
			};
			class wheelbackleft: wheelfrontleft
			{
				source = "wheelbackleft";
				selection = "wheel_1_2";
				axis = "wheel_1_2_axis";
			};
			class wheelbackright: wheelfrontleft
			{
				source = "wheelbackright";
				selection = "wheel_2_2";
				axis = "wheel_2_2_axis";
			};

			// Steering and suspension: the car simulation looks these names up (config
			// animTurn / animDamper). Rollers don't steer or travel visibly, so they do nothing.
			class turnfrontleft
			{
				type = "rotationY";
				source = "turnfrontleft";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = 0;
				angle1 = 0;
			};
			class turnfrontright: turnfrontleft
			{
				source = "turnfrontright";
				selection = "wheel_2_1";
			};
			class turnbackleft: turnfrontleft
			{
				source = "turnbackleft";
				selection = "wheel_1_2";
			};
			class turnbackright: turnfrontleft
			{
				source = "turnbackright";
				selection = "wheel_2_2";
			};
			class damper_1_1
			{
				type = "translationY";
				source = "damper_1_1";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0;
			};
			class damper_2_1: damper_1_1
			{
				source = "damper_2_1";
				selection = "wheel_2_1";
			};
			class damper_1_2: damper_1_1
			{
				source = "damper_1_2";
				selection = "wheel_1_2";
			};
			class damper_2_2: damper_1_1
			{
				source = "damper_2_2";
				selection = "wheel_2_2";
			};

			// Blade lift: phase 0 = down (cutting edge just above the ground), 1 = raised.
			// Angles come from blender/build_bulldozer.py (BLADE_MIN_DEG / BLADE_MAX_DEG).
			class BladeLift
			{
				type = "rotationX";
				source = "bladeLift";
				selection = "blade";
				axis = "blade_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -1.1";
				angle1 = "rad 15";
			};
			// Lift cylinder barrels follow the blade mount (cylinder_angles() in the build script)
			class BladeCylinders: BladeLift
			{
				selection = "blade_cyl";
				axis = "blade_cyl_axis";
				angle0 = "rad -1.11";
				angle1 = "rad 20.42";
			};
		};
	};
};
