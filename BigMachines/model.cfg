				selection = "stick_cyl";
				axis = "stick_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -2.54";
				angle1 = "rad -9.13";
			};
			class Bucket
			{
				type = "rotationX";
				source = "bucket";
				selection = "bucket";
				axis = "bucket_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad 35";
				angle1 = "rad -95";	// 35 dumped, -95 curled in (the teeth face the machine)
			};
			class BucketCylinder
			{
				type = "rotationX";
				source = "bucketCyl";
				selection = "bucket_cyl";
				axis = "bucket_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -5.47";
				angle1 = "rad -6.96";
			};
			// Each cylinder's rod slides in its barrel (offsets: blender/build_excavator.py)
			class BoomRods
			{
				type = "translation";
				source = "boomRod";
				selection = "boom_rod";
				axis = "boom_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.317;
				offset1 = 0.289;
			};
			class StickRod
			{
				type = "translation";
				source = "dipperRod";
				selection = "stick_rod";
				axis = "stick_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0.714;
				offset1 = -0.531;
			};
			class BucketRod
			{
				type = "translation";
				source = "bucketRod";
				selection = "bucket_rod";
				axis = "bucket_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.212;
				offset1 = 0.621;
			};
			// The treads (blender/crawler.py Tracks.treads): each part moves one shoe on per
			// cycle, driving forwards; BM_Machine.TreadFrame loops them from the ground speed.
			// Offset and angle: printed by blender/build_excavator.py. Sources of their own.
			class TreadTop1
			{
				type = "translation";
				source = "treadTop1";
				selection = "tread_1_top";
				axis = "tread_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0.1765;
			};
			class TreadBottom1: TreadTop1
			{
				source = "treadBottom1";
				selection = "tread_1_bottom";
				offset1 = -0.1765;
			};
			class TreadTop2: TreadTop1
			{
				source = "treadTop2";
				selection = "tread_2_top";
			};
			class TreadBottom2: TreadBottom1
			{
				source = "treadBottom2";
				selection = "tread_2_bottom";
			};
			class TreadFront1
			{
				type = "rotationX";
				source = "treadFront1";
				selection = "tread_1_front";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -25.7143";
			};
			class TreadRear1: TreadFront1
			{
				source = "treadRear1";
				selection = "tread_1_rear";
				axis = "wheel_1_2_axis";
			};
			class TreadFront2: TreadFront1
			{
				source = "treadFront2";
				selection = "tread_2_front";
				axis = "wheel_2_1_axis";
			};
			class TreadRear2: TreadFront1
			{
				source = "treadRear2";
				selection = "tread_2_rear";
				axis = "wheel_2_2_axis";
			};
		};
	};
