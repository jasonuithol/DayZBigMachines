// Skeletons and animations for the BigMachines models. Binarize bakes this into each
// .p3d whose file name matches a CfgModels class. Joint angles and cylinder swings come from
// the blender/build_*.py scripts, which print them.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	//! Every crawler: the four rollers
	class BM_Crawler_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"wheel_1_1", "",
			"wheel_1_2", "",
			"wheel_2_1", "",
			"wheel_2_2", ""
		};
	};
	//! crewDriver: the engine finds the driver's seat proxy through a bone of this name
	class BM_Bulldozer_Skeleton: BM_Crawler_Skeleton
	{
		skeletonInherit = "BM_Crawler_Skeleton";
		skeletonBones[] =
		{
			"blade", "",
			"blade_cyl", "",
			"blade_rod", "blade_cyl",
			"crewDriver", "",
			"tread_1_top", "",
			"tread_1_bottom", "",
			"tread_1_front", "",
			"tread_1_rear", "",
			"tread_2_top", "",
			"tread_2_bottom", "",
			"tread_2_front", "",
			"tread_2_rear", ""
		};
	};
	//! The tower crane's top: the trolley runs along the jib, the hook and the cable pieces hang
	//! from it (blender/build_tower_crane.py)
	class BM_TowerCrane_Skeleton: BM_Crawler_Skeleton
	{
		skeletonInherit = "BM_Crawler_Skeleton";
		skeletonBones[] =
		{
			"trolley", "",
			"hook", "trolley",
			"cable_2", "trolley",
			"cable_3", "trolley",
			"cable_4", "trolley",
			"cable_5", "trolley",
			"cable_6", "trolley",
			"cable_7", "trolley",
			"crewDriver", ""
		};
	};
	//! The house is the root; slewing turns the whole machine and the undercarriage (tracks,
	//! rollers) turns back the other way (BM_Excavator.c)
	class BM_Excavator_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"undercarriage", "",
			"wheel_1_1", "undercarriage",
			"wheel_1_2", "undercarriage",
			"wheel_2_1", "undercarriage",
			"wheel_2_2", "undercarriage",
			"tread_1_top", "undercarriage",
			"tread_1_bottom", "undercarriage",
			"tread_1_front", "undercarriage",
			"tread_1_rear", "undercarriage",
			"tread_2_top", "undercarriage",
			"tread_2_bottom", "undercarriage",
			"tread_2_front", "undercarriage",
			"tread_2_rear", "undercarriage",
			"crewDriver", "",
			"boom", "",
			"boom_cyl", "",
			"boom_rod", "boom_cyl",
			"stick", "boom",
			"stick_cyl", "boom",
			"stick_rod", "stick_cyl",
			"bucket", "stick",
			"bucket_cyl", "stick",
			"bucket_rod", "bucket_cyl"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class bm_dozer_roller: Default {};
	class bm_exc_roller: Default {};
	class bm_crane_roller: Default {};
	class bm_crane_mast: Default {};

	//! The wheel bones hold the wheel items' proxies (invisible: the game moves these bones
	//! with the suspension, see blender/crawler.py). Rotation, steering and suspension
	//! animations must exist (config.cpp animRotation / animTurn / animDamper).
	class BM_Crawler: Default
	{
		skeletonName = "BM_Crawler_Skeleton";
		class Animations
		{
			class wheelfrontleft
			{
				type = "rotationX";
				source = "wheelfrontleft";
				selection = "wheel_1_1";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -360";
			};
			class wheelfrontright: wheelfrontleft
			{
				source = "wheelfrontright";
				selection = "wheel_2_1";
				axis = "wheel_2_1_axis";
			};
			class wheelbackleft: wheelfrontleft
			{
				source = "wheelbackleft";
				selection = "wheel_1_2";
				axis = "wheel_1_2_axis";
			};
			class wheelbackright: wheelfrontleft
			{
				source = "wheelbackright";
				selection = "wheel_2_2";
				axis = "wheel_2_2_axis";
			};
			class turnfrontleft
			{
				type = "rotationY";
				source = "turnfrontleft";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = 0;
				angle1 = 0;
			};
			class turnfrontright: turnfrontleft
			{
				source = "turnfrontright";
				selection = "wheel_2_1";
			};
			class turnbackleft: turnfrontleft
			{
				source = "turnbackleft";
				selection = "wheel_1_2";
			};
			class turnbackright: turnfrontleft
			{
				source = "turnbackright";
				selection = "wheel_2_2";
			};
			class damper_1_1
			{
				type = "translationY";
				source = "damper_1_1";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0;
			};
			class damper_2_1: damper_1_1
			{
				source = "damper_2_1";
				selection = "wheel_2_1";
			};
			class damper_1_2: damper_1_1
			{
				source = "damper_1_2";
				selection = "wheel_1_2";
			};
			class damper_2_2: damper_1_1
			{
				source = "damper_2_2";
				selection = "wheel_2_2";
			};
		};
	};

	class bm_bulldozer: BM_Crawler
	{
		skeletonName = "BM_Bulldozer_Skeleton";
		class Animations: Animations
		{
			// Blade lift: phase 0 = down (cutting edge just above the ground), 1 = raised
			class BladeLift
			{
				type = "rotationX";
				source = "bladeLift";
				selection = "blade";
				axis = "blade_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -1.1";
				angle1 = "rad 15";
			};
			// Lift cylinder barrels follow the blade mount
			class BladeCylinders: BladeLift
			{
				source = "bladeCyl";	// never share a source between animations (BM_Machine.AddJoint)
				selection = "blade_cyl";
				axis = "blade_cyl_axis";
				angle0 = "rad -1.11";
				angle1 = "rad 20.42";
			};
			// Each cylinder's rod slides in its barrel (offsets: blender/build_bulldozer.py)
			class BladeRods
			{
				type = "translation";
				source = "bladeRod";
				selection = "blade_rod";
				axis = "blade_rod_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0.037;
				offset1 = -0.49;
			};
			// The treads (blender/crawler.py Tracks.treads): each part moves one shoe on per
			// cycle, driving forwards; BM_Machine.TreadFrame loops them from the ground speed.
			// Offset and angle: printed by blender/build_bulldozer.py. Sources of their own.
			class TreadTop1
			{
				type = "translation";
				source = "treadTop1";
				selection = "tread_1_top";
				axis = "tread_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0.2046;
			};
			class TreadBottom1: TreadTop1
			{
				source = "treadBottom1";
				selection = "tread_1_bottom";
				offset1 = -0.2046;
			};
			class TreadTop2: TreadTop1
			{
				source = "treadTop2";
				selection = "tread_2_top";
			};
			class TreadBottom2: TreadBottom1
			{
				source = "treadBottom2";
				selection = "tread_2_bottom";
			};
			class TreadFront1
			{
				type = "rotationX";
				source = "treadFront1";
				selection = "tread_1_front";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -25.7143";
			};
			class TreadRear1: TreadFront1
			{
				source = "treadRear1";
				selection = "tread_1_rear";
				axis = "wheel_1_2_axis";
			};
			class TreadFront2: TreadFront1
			{
				source = "treadFront2";
				selection = "tread_2_front";
				axis = "wheel_2_1_axis";
			};
			class TreadRear2: TreadFront1
			{
				source = "treadRear2";
				selection = "tread_2_rear";
				axis = "wheel_2_2_axis";
			};
		};
	};

	class bm_excavator: BM_Crawler
	{
		skeletonName = "BM_Excavator_Skeleton";
		class Animations: Animations
		{
			// Slewing: the machine turns by the slew angle and the tracks turn back by it.
			// Phase 0.5 = no slew; 0 / 1 = half a turn either way (the source wraps round).
			class Undercarriage
			{
				type = "rotationY";
				source = "slew";
				selection = "undercarriage";
				axis = "undercarriage_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -180";	// checked in game: the other way round doubles the turn
				angle1 = "rad 180";
			};
			// Each animation has a source of its own: two sharing one scramble the sources
			// after them (BM_Machine.AddJoint sets each cylinder's in step with its joint)
			class Boom
			{
				type = "rotationX";
				source = "boom";
				selection = "boom";
				axis = "boom_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -35";
				angle1 = "rad 30";
			};
			class BoomCylinders
			{
				type = "rotationX";
				source = "boomCyl";
				selection = "boom_cyl";
				axis = "boom_cyl_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -39.29";
				angle1 = "rad 28.39";
			};
			class Stick
			{
				type = "rotationX";
				source = "dipper";
				selection = "stick";
				axis = "stick_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -45";
				angle1 = "rad 40";
			};
			class StickCylinder
