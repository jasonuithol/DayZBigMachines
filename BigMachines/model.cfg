// Skeletons and animations for the BigMachines models. Binarize bakes this into each
// .p3d whose file name matches a CfgModels class. Joint angles and cylinder swings come from
// the blender/build_*.py scripts, which print them.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	//! Every crawler: the four rollers
	class BM_Crawler_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"wheel_1_1", "",
			"wheel_1_2", "",
			"wheel_2_1", "",
			"wheel_2_2", ""
		};
	};
	//! crewDriver: the engine finds the driver's seat proxy through a bone of this name
	class BM_Bulldozer_Skeleton: BM_Crawler_Skeleton
	{
		skeletonInherit = "BM_Crawler_Skeleton";
		skeletonBones[] =
		{
			"blade", "",
			"blade_cyl", "",
			"crewDriver", ""
		};
	};
	//! The house is the root; slewing turns the whole machine and the undercarriage (tracks,
	//! rollers) turns back the other way (BM_Excavator.c)
	class BM_Excavator_Skeleton: Default
	{
		isDiscrete = 0;
		skeletonBones[] =
		{
			"undercarriage", "",
			"wheel_1_1", "undercarriage",
			"wheel_1_2", "undercarriage",
			"wheel_2_1", "undercarriage",
			"wheel_2_2", "undercarriage",
			"crewDriver", "",
			"boom", "",
			"boom_cyl", "",
			"stick", "boom",
			"stick_cyl", "boom",
			"bucket", "stick",
			"bucket_cyl", "stick"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class bm_dozer_roller: Default {};
	class bm_exc_roller: Default {};

	//! Rollers spin with the physics wheels (names: config.cpp's animRotation). Steering and
	//! suspension animations must exist (animTurn / animDamper) but rollers don't show them.
	class BM_Crawler: Default
	{
		skeletonName = "BM_Crawler_Skeleton";
		class Animations
		{
			class wheelfrontleft
			{
				type = "rotationX";
				source = "wheelfrontleft";
				selection = "wheel_1_1";
				axis = "wheel_1_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad -360";
			};
			class wheelfrontright: wheelfrontleft
			{
				source = "wheelfrontright";
				selection = "wheel_2_1";
				axis = "wheel_2_1_axis";
			};
			class wheelbackleft: wheelfrontleft
			{
				source = "wheelbackleft";
				selection = "wheel_1_2";
				axis = "wheel_1_2_axis";
			};
			class wheelbackright: wheelfrontleft
			{
				source = "wheelbackright";
				selection = "wheel_2_2";
				axis = "wheel_2_2_axis";
			};
			class turnfrontleft
			{
				type = "rotationY";
				source = "turnfrontleft";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = 0;
				angle1 = 0;
			};
			class turnfrontright: turnfrontleft
			{
				source = "turnfrontright";
				selection = "wheel_2_1";
			};
			class turnbackleft: turnfrontleft
			{
				source = "turnbackleft";
				selection = "wheel_1_2";
			};
			class turnbackright: turnfrontleft
			{
				source = "turnbackright";
				selection = "wheel_2_2";
			};
			class damper_1_1
			{
				type = "translationY";
				source = "damper_1_1";
				selection = "wheel_1_1";
				axis = "";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 0;
			};
			class damper_2_1: damper_1_1
			{
				source = "damper_2_1";
				selection = "wheel_2_1";
			};
			class damper_1_2: damper_1_1
			{
				source = "damper_1_2";
				selection = "wheel_1_2";
			};
			class damper_2_2: damper_1_1
			{
				source = "damper_2_2";
				selection = "wheel_2_2";
			};
		};
	};

	class bm_bulldozer: BM_Crawler
	{
		skeletonName = "BM_Bulldozer_Skeleton";
		class Animations: Animations
		{
			// Blade lift: phase 0 = down (cutting edge just above the ground), 1 = raised
			class BladeLift
			{
				type = "rotationX";
				source = "bladeLift";
				selection = "blade";
				axis = "blade_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -1.1";
				angle1 = "rad 15";
			};
			// Lift cylinder barrels follow the blade mount
			class BladeCylinders: BladeLift
			{
				selection = "blade_cyl";
				axis = "blade_cyl_axis";
				angle0 = "rad -1.11";
				angle1 = "rad 20.42";
			};
		};
	};

	class bm_excavator: BM_Crawler
	{
		skeletonName = "BM_Excavator_Skeleton";
		class Animations: Animations
		{
			// Slewing: the machine turns by the slew angle and the tracks turn back by it.
			// Phase 0.5 = no slew; 0 / 1 = half a turn either way (the source wraps round).
			class Undercarriage
			{
				type = "rotationY";
				source = "slew";
				selection = "undercarriage";
				axis = "undercarriage_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -180";	// checked in game: the other way round doubles the turn
				angle1 = "rad 180";
			};
			class Boom
			{
				type = "rotationX";
				source = "boom";
				selection = "boom";
				axis = "boom_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -35";
				angle1 = "rad 30";
			};
			class BoomCylinders: Boom
			{
				selection = "boom_cyl";
				axis = "boom_cyl_axis";
				angle0 = "rad -39.29";
				angle1 = "rad 28.39";
			};
			class Stick: Boom
			{
				source = "stick";
				selection = "stick";
				axis = "stick_axis";
				angle0 = "rad -45";
				angle1 = "rad 40";
			};
			class StickCylinder: Stick
			{
				selection = "stick_cyl";
				axis = "stick_cyl_axis";
				angle0 = "rad -2.54";
				angle1 = "rad -9.13";
			};
			class Bucket: Boom
			{
				source = "bucket";
				selection = "bucket";
				axis = "bucket_axis";
				angle0 = "rad -70";
				angle1 = "rad 55";
			};
			class BucketCylinder: Bucket
			{
				selection = "bucket_cyl";
				axis = "bucket_cyl_axis";
				angle0 = "rad 13.42";
				angle1 = "rad -7.48";
			};
		};
	};
};
